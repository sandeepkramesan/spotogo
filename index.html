<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spotogo · Coming soon</title>
<meta name="description" content="Watched a hundred café and restaurant reels, but can’t remember which one is where? Your solution is coming soon." />
<meta name="theme-color" content="#FCFAF6" />
<meta name="robots" content="noindex" />
<link rel="icon" href="icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="site.css?v=5" />
<script>
  // Shared-spot links used to live at the site root (#<payload>); send them to /s/.
  function toSpot() { if (location.hash.length > 20) location.replace('s/' + location.hash); }
  toSpot();
  addEventListener('hashchange', toSpot);
</script>
<style>
  /* The full home page is kept in site/launch/ until Spotogo is on Google Play. */
  main { min-height: calc(100vh - 80px); display: flex; flex-direction: column; }
  .soon { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 48px 0; }
  .soon h1 { font-size: clamp(30px, 6vw, 46px); max-width: 720px; }
  .soon .lead { font-size: 20px; color: var(--text); margin: 18px 0 22px; }
  .mail { align-self: flex-start; font-weight: 600; font-size: 17px; text-decoration: none;
    border: 1px solid var(--border); background: var(--card); padding: 10px 18px; border-radius: 999px; }
  .mail:hover { border-color: var(--accent); }
  .pill { display: inline-block; align-self: flex-start; background: var(--accent); color: #fff;
    font-weight: 700; font-size: 13px; letter-spacing: .4px; text-transform: uppercase; padding: 4px 12px;
    border-radius: 999px; margin-bottom: 16px; }
</style>
</head>
<body>
<main>
  <a class="brand" href="./"><span class="logo-text"><img class="logo" src="logo.png" alt="Spotogo" /><span class="tagline">Find it. Pin it. Go.</span></span></a>

  <section class="soon">
    <span class="pill">Coming soon</span>
    <h1>Watched a hundred café and restaurant reels, but can’t remember which one is where?</h1>
    <p class="lead">Your solution is coming soon.</p>
    <a class="mail" href="mailto:support@spotogo.in">support@spotogo.in</a>
  </section>

  <footer><a href="./">Spotogo</a><a href="privacy">Privacy</a><a href="terms">Terms</a><a href="delete-data">Delete your data</a></footer>
</main>
</body>
</html>
