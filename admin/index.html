<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SpotoGo Dashboard</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#FCFAF6" />
<link rel="icon" type="image/png" href="../favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* The founder dashboard on the web (user, 2026-11-03). Same data as the app's (backend/src/admin.ts);
     sign in with the founder's email code. Not linked from anywhere, not indexed. */
  :root {
    --bg: #FCFAF6; --card: #FFFFFF; --text: #202120; --muted: #777C79; --faint: #9EA39F; --border: #E3DED4;
    --accent: #48B88C; --on-accent: #10291F; --hi: #2F9E74; --soft: #E4F4EC; --warn: #D9921A; --bad: #EF4444; --dark: #183C30;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121314; --card: #1E2120; --text: #F5F3EE; --muted: #A8B0AB; --faint: #6B726F; --border: #2E3330;
      --hi: #48B88C; --soft: #1C2E26; --warn: #F9C15A;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; line-height: 1.4; font-size: 14px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); }
  .bar { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .bar img { height: 26px; display: block; }
  .bar h1 { font-size: 15px; margin: 0; flex: 1; font-weight: 800; }
  .btn { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 999px; padding: 5px 12px; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.danger { color: var(--bad); border-color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: default; }
  main { max-width: 1240px; margin: 0 auto; padding: 12px 16px 40px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  p.muted { margin: 6px 0; }
  /* Layout: a row of headline numbers, then two columns of cards. */
  .kpis { display: grid; gap: 8px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (min-width: 900px) { .kpis { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
  @media (max-width: 420px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { #who { display: none; } .bar h1 { font-size: 14px; } }
  /* One section per row (user, 2026-11-24): the two column wrappers just pass their cards through. */
  .cols { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); margin-top: 12px; }
  .stack { display: contents; }
  /* Tap a section's heading to fold it to just the heading (kept in this browser). */
  #app .card > h2:first-child { cursor: pointer; user-select: none; }
  #app .card > h2:first-child::after { content: '▾'; margin-left: auto; color: var(--faint); font-size: 13px; }
  #app .card.folded > h2:first-child { margin-bottom: 0; }
  #app .card.folded > h2:first-child::after { content: '▸'; }
  #app .card.folded > *:not(:first-child) { display: none; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .card > h2:first-child { margin-top: 0; }
  .tiles { display: grid; gap: 8px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .tiles .stat { background: var(--bg); }
  .stat .v { font-size: 20px; font-weight: 800; color: var(--hi); line-height: 1.2; }
  .stat .v.plain { color: var(--text); }
  .stat .l { font-size: 12px; color: var(--muted); }
  .stat .s { font-size: 11px; color: var(--faint); }
  h2 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font-weight: 800; }
  h2 .count { background: var(--accent); color: var(--on-accent); border-radius: 999px; font-size: 11px; padding: 1px 8px; }
  h3 { font-size: 12px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .8px; color: var(--hi); font-weight: 800; }
  .alert { border: 1.5px solid var(--warn); border-radius: 10px; padding: 7px 12px; margin: 0 0 10px; font-size: 13px; background: var(--card); }
  .item { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
  .item:first-child, h2 + .item, h3 + .item, .muted + .item { border-top: 0; }
  .item .main { flex: 1 1 240px; min-width: 0; }
  .item .main > span, .item .main > b, .item .main > a { display: block; overflow-wrap: anywhere; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .tag { font-size: 10.5px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--hi); }
  .meter { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; margin: 6px 0 4px; }
  .meter > div { height: 100%; border-radius: 4px; }
  .lim + .lim { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin-top: 8px; }
  .chart .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
  .chart .b { width: 100%; border-radius: 3px 3px 0 0; background: var(--accent); min-height: 2px; }
  .chart .d { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--text); }
  .chart .x { font-size: 9.5px; color: var(--faint); margin-top: 3px; }
  input, select { height: 32px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; font: inherit; font-size: 13px; background: var(--bg); color: var(--text); min-width: 0; }
  input { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row input[type=number] { width: 84px; }
  .form { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); align-items: end; }
  .form label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .form .wide { grid-column: span 2; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; gap: 2px; }
  .seg .btn { border: 0; }
  table.rep { width: 100%; border-collapse: collapse; margin: 6px 0 4px; font-size: 13px; }
  table.rep td, table.rep th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  table.rep th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); font-weight: 700; }
  #repDate { width: auto; }
  .split { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
  .split > div + div { border-top: 1px solid var(--border); padding-top: 12px; }
  .code { font-family: ui-monospace, Consolas, monospace; letter-spacing: .5px; font-size: 13px; }
  .more { margin-top: 6px; }
  .login { max-width: 360px; margin: 12vh auto; text-align: center; }
  .login .card { text-align: left; display: grid; gap: 10px; }
  .login input { height: 40px; font-size: 15px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; }
  a { color: var(--hi); }
  dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--card); color: var(--text); max-width: 420px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .person { border-top: 1px solid var(--border); padding-top: 4px; margin-top: 4px; }
  .person:first-child { border: 0; }
  .sub { padding-left: 12px; }
  .ok { color: var(--hi); font-size: 12px; font-weight: 700; }
  .warn { color: var(--warn); font-size: 12px; font-weight: 700; }
</style>
</head>
<body>
<header><div class="bar">
  <picture><source srcset="../logo-dark.png" media="(prefers-color-scheme: dark)" /><img src="../logo.png" alt="SpotoGo" /></picture>
  <h1>Founder dashboard</h1>
  <span id="who" class="muted"></span>
  <button id="refresh" class="btn" hidden>Refresh</button>
  <button id="logout" class="btn" hidden>Log out</button>
</div></header>

<section id="login" class="login" hidden>
  <p class="muted">Sign in with the founder’s SpotoGo email.</p>
  <div class="card">
    <input id="email" type="email" placeholder="Email" autocomplete="email" />
    <button id="send" class="btn primary">Send code</button>
    <input id="code" inputmode="numeric" placeholder="6-digit code" hidden />
    <button id="verify" class="btn primary" hidden>Sign in</button>
    <div id="loginErr" class="err"></div>
  </div>
</section>

<main id="app" hidden></main>
<dialog id="confirm"><p id="cText"></p>
  <textarea id="cWhy" rows="4" maxlength="600" placeholder="Why? This goes to them by email, with an apology and how to get it." style="width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid var(--border);border-radius:10px;margin:0 0 12px;background:var(--bg);color:var(--text)"></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end">
  <button class="btn" value="no" id="cNo">Cancel</button><button class="btn primary" id="cYes">OK</button></div></dialog>

<script>
(function () {
  // ?api=http://localhost:8787 points the page at a local server (local tests only; other hosts are ignored).
  var LOCAL = new URLSearchParams(location.search).get('api');
  var API = LOCAL && /^http:\/\/localhost:\d+$/.test(LOCAL) ? LOCAL : 'https://api.spotogo.in';
  var KEY = 'spotogo.admin.session';
  var session = null;
  try { session = localStorage.getItem(KEY); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var n = function (x) { return Number(x || 0).toLocaleString('en-IN'); };
  var ago = function (ms) { var m = Math.round((Date.now() - ms) / 60000); if (m < 60) return m + ' min ago'; var h = Math.round(m / 60); return h < 48 ? h + ' h ago' : Math.round(h / 24) + ' days ago'; };

  function api(path, body, method) {
    return fetch(API + path, {
      method: method || (body ? 'POST' : 'GET'),
      headers: Object.assign({ 'content-type': 'application/json' }, session ? { authorization: 'Bearer ' + session } : {}),
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.error || ('Error ' + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  // needWhy: turning someone down; the reason is required and goes to them by email.
  // Resolves to false (cancelled) or the reason ('' when none is asked).
  var WHY_HINT = null;
  function ask(text, yes, danger, needWhy, hint) {
    return new Promise(function (resolve) {
      $('cText').textContent = text; $('cYes').textContent = yes;
      $('cYes').className = 'btn ' + (danger ? 'danger' : 'primary');
      var why = $('cWhy'); why.hidden = !needWhy; why.value = '';
      if (WHY_HINT === null) WHY_HINT = why.placeholder;
      why.placeholder = hint || WHY_HINT;
      var d = $('confirm');
      $('cYes').onclick = function () {
        var r = why.value.trim();
        if (needWhy && r.length < 5) { why.focus(); why.style.borderColor = '#EF4444'; return; }
        why.style.borderColor = ''; d.close(); resolve(needWhy ? r : '');
      };
      $('cNo').onclick = function () { d.close(); resolve(false); };
      d.showModal();
      if (needWhy) why.focus();
    });
  }

  function showLogin(msg) {
    $('login').hidden = false; $('app').hidden = true; $('refresh').hidden = true; $('logout').hidden = true; $('who').textContent = '';
    $('loginErr').textContent = msg || '';
  }
  $('send').onclick = function () {
    var email = $('email').value.trim(); if (!email) return;
    $('send').disabled = true; $('loginErr').textContent = '';
    api('/auth/email/start', { email: email, existing: true }).then(function () {
      $('code').hidden = false; $('verify').hidden = false; $('code').focus(); $('send').textContent = 'Send again';
    }).catch(function (e) { $('loginErr').textContent = e.message; }).finally(function () { $('send').disabled = false; });
  };
  $('verify').onclick = function () {
    $('verify').disabled = true; $('loginErr').textContent = '';
    api('/auth/email/verify', { email: $('email').value.trim(), code: $('code').value.trim(), existing: true }).then(function (r) {
      session = r.session; try { localStorage.setItem(KEY, session); } catch (e) {}
      start();
    }).catch(function (e) { $('loginErr').textContent = e.message; }).finally(function () { $('verify').disabled = false; });
  };
  $('logout').onclick = function () { session = null; try { localStorage.removeItem(KEY); } catch (e) {} showLogin(); };
  $('refresh').onclick = load;

  function start() {
    if (!session) return showLogin();
    api('/admin/api/me').then(function (r) {
      $('login').hidden = true; $('app').hidden = false; $('refresh').hidden = false; $('logout').hidden = false;
      $('who').textContent = r.email;
      load();
    }).catch(function (e) {
      if (e.status === 403) { session = null; try { localStorage.removeItem(KEY); } catch (x) {} return showLogin('This account can’t open the dashboard.'); }
      showLogin(e.status === 401 ? '' : e.message);
    });
  }

  function stat(label, value, sub, plain) {
    return '<div class="stat"><div class="v' + (plain ? ' plain' : '') + '">' + esc(value) + '</div><div class="l">' + esc(label) + '</div>' + (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div>';
  }
  function meter(label, used, limit) {
    var pct = Math.min(100, used / limit * 100), c = pct >= 90 ? 'var(--bad)' : pct >= 70 ? 'var(--warn)' : 'var(--accent)';
    return '<div class="lim"><div style="display:flex"><b style="flex:1">' + esc(label) + '</b><b style="color:' + c + '">' + (pct < 1 && used > 0 ? '&lt;1' : Math.round(pct)) + '%</b></div>' +
      '<div class="meter"><div style="width:' + Math.max(pct, used ? 1 : 0) + '%;background:' + c + '"></div></div><div class="muted">' + n(used) + ' of ' + n(limit) + ' free</div></div>';
  }
  function btn(act, id, name, label, kind) {
    return '<button class="btn' + (kind ? ' ' + kind : '') + '" data-act="' + act + '" data-id="' + esc(id) + '" data-name="' + esc(name) + '">' + label + '</button>';
  }
  function item(main, acts) {
    return '<div class="item"><div class="main">' + main + '</div>' + (acts ? '<div class="acts">' + acts + '</div>' : '') + '</div>';
  }

  // Layout (user, 2026-11-18: "clean and compact"): headline numbers in one row, then two columns.
  // Left: what needs you (to do, sign-ups). Right: how things are going (today, reels, content, limits, people).
  function render(d) {
    var u = d.users, h = '';
    d.alerts.forEach(function (a) { h += '<div class="alert">⚠ ' + esc(a) + '</div>'; });
    h += '<div class="kpis">' + stat('Active today', n(u.dau)) + stat('Active 7 days', n(u.wau)) + stat('Active 30 days', n(u.mau)) +
      stat('Stickiness', u.stickiness + '%', 'today ÷ 30 days') + stat('Accounts', n(u.total), n(u.diners) + ' diners · ' + n(u.restaurants) + ' restaurants', true) +
      stat('New today', '+' + n(u.newToday), n(u.new7d) + ' in 7 d · ' + n(u.new30d) + ' in 30 d', true) + stat('Verified', n(u.verified), null, true) + '</div>';

    h += '<div class="cols"><div class="stack" id="colA">';
    var reports = d.todo.placeReports || [], creports = d.todo.contentReports || [];
    var names = d.todo.names || [];
    var todo = d.todo.requests.length + d.todo.claims.length + reports.length + creports.length + d.todo.social.length + names.length;
    h += '<div class="card"><h2>To do' + (todo ? ' <span class="count">' + todo + '</span>' : '') + '</h2>';
    if (!todo) h += '<p class="muted">Nothing waiting on you.</p>';
    names.forEach(function (x) {
      var what = x.kind === 'rename'
        ? '<b>' + esc(x.restaurant) + ' → ' + esc(x.name) + '</b><span class="muted">Rename the page. The old name stays, so its saves keep counting.</span>'
        : '<b>Count “' + esc(x.name) + '” for ' + esc(x.restaurant) + '</b><span class="muted">' + (x.saves ? n(x.saves) + ' saves under that name nearby' : 'No saves under that name nearby yet') + '. Check it’s the same place, not a neighbour.</span>';
      h += item('<span class="tag">' + (x.kind === 'rename' ? 'Rename request' : 'Link a name') + '</span>' + what +
        (x.note ? '<span class="muted">“' + esc(x.note) + '”</span>' : '') +
        '<span class="muted">' + esc(x.address) + ' · ' + esc(x.email || '') + ' · ' + ago(x.at) + ' · <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(x.name) + '%20' + x.lat + ',' + x.lng + '">check on Google Maps</a></span>',
        btn('name-no', x.id, x.name, 'Reject') + btn('name-yes', x.id, x.name, 'Approve', 'primary'));
    });
    creports.forEach(function (r) {
      var what = r.target_type === 'user' ? 'Profile @' + esc(r.target_username) : (r.target_type === 'spot' ? 'Spot' : 'List') + ' “' + esc(r.title || '?') + '” by @' + esc(r.target_username);
      h += item('<span class="tag" style="color:var(--bad)">Report · ' + esc(r.reasonLabel) + '</span><b>' + what + '</b>' +
        (r.note ? '<span class="muted">“' + esc(r.note) + '”</span>' : '') +
        '<span class="muted">by @' + esc(r.reporter_username) + ' · ' + ago(r.created_at) + (r.against > 1 ? ' · ' + r.against + ' open reports about @' + esc(r.target_username) : '') + '</span>',
        btn('cr-dismiss', r.id, r.target_username, 'Dismiss') + (r.target_type !== 'user' ? btn('cr-hide', r.id, r.target_username, 'Hide') : '') + btn('cr-suspend', r.id, r.target_username, 'Suspend', 'danger'));
    });
    notesFor = {};
    var KIND = { closed: 'closed for good', temp: 'closed for now', hours: 'hours wrong', open: 'open again', renamed: 'new name', delivery: 'delivery only' };
    reports.forEach(function (g) {
      var counts = Object.keys(KIND).filter(function (k) { return g.kinds[k]; }).map(function (k) { return KIND[k] + ' ×' + g.kinds[k]; }).join(' · ');
      var ids = g.ids.join(',');
      h += item('<span class="tag">Diners report a change</span><b>' + esc(g.name) + '</b><span class="muted">' + esc(counts) + ' · ' + ago(g.latest) + '</span>' +
        g.notes.slice(0, 3).map(function (x) { return '<span class="muted">“' + esc(x.text) + '”' + (x.by ? ' · @' + esc(x.by) : '') + '</span>'; }).join('') +
        '<a class="muted" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(g.name) + '%20' + g.lat + ',' + g.lng + '">Check it on Google Maps</a>',
        (g.claimed && (g.kinds.renamed || g.kinds.hours) ? '<span class="muted" style="flex-basis:100%">Claimed: its owner sees these suggestions and sets the name and hours.</span>' : '') +
        (g.kinds.renamed && !g.claimed ? btn('place-rename', ids, g.name, 'Use new name') : '') + (g.kinds.hours && !g.claimed ? btn('place-hours', ids, g.name, 'Set hours') : '') +
        (g.kinds.closed || g.kinds.temp || g.kinds.open ? btn('place-closed', ids, g.name, 'Closed for good', 'danger') + btn('place-temp', ids, g.name, 'Closed for now') + btn('place-open', ids, g.name, 'Open') : '') +
        (g.kinds.delivery ? btn('place-delivery', ids, g.name, 'Delivery only') + btn('place-dinein', ids, g.name, 'Has seating') : '') +
        btn('place-dismiss', ids, g.name, 'Dismiss'));
      notesFor[ids] = g.notes;
    });
    d.todo.requests.forEach(function (r) {
      h += item('<span class="tag">Verification request</span><b>@' + esc(r.username) + (r.name ? ' · ' + esc(r.name) : '') + '</b><span class="muted">' + esc(r.email) + ' · ' + n(r.spots) + ' spots · asked ' + ago(r.requested) + '</span>',
        btn('req-no', r.id, r.username, 'Reject') + btn('req-yes', r.id, r.username, 'Verify', 'primary'));
    });
    d.todo.claims.forEach(function (c) {
      h += item('<span class="tag">Restaurant claim' + (c.unlisted ? ' · not on the map' : '') + '</span>' + (c.unlisted ? '<span class="warn">They added this place themselves: check the name, address and <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + c.lat + ',' + c.lng + '">pin</a>.</span>' : '') + '<b>' + esc(c.name) + '</b><span class="muted">' + esc(c.address) + '</span><span class="muted">' + esc(c.role || 'Role not given') + ' · ' + esc(c.contact) + ' · ' + esc(c.email) + '</span>' +
        (c.gstin ? '<span class="muted">GSTIN <b style="display:inline">' + esc(c.gstin) + '</b> · <a href="https://services.gst.gov.in/services/searchtp" target="_blank" rel="noopener">check on the GST portal</a></span>' : '') +
        (c.note ? '<span class="muted">“' + esc(c.note) + '”</span>' : ''),
        btn('claim-no', c.id, c.name, 'Reject') + btn('claim-yes', c.id, c.name, 'Approve', 'primary'));
    });
    // Only ones waiting here; the rest show with each person in "Find someone".
    d.todo.social.forEach(function (s) {
      h += item('<span class="tag">Instagram / YouTube waiting</span><b>@' + esc(s.handle) + ' · ' + (s.platform === 'instagram' ? 'Instagram' : 'YouTube') + '</b><span class="muted">on @' + esc(s.username) + (s.followers != null ? ' · ' + n(s.followers) + ' followers' : '') + ' · ' + ago(s.at) + '</span>',
        btn('social-remove', s.id, s.handle, 'Remove', 'danger'));
    });
    h += '</div>';

      var left = c.max_uses - c.uses, expired = c.expires_at && c.expires_at < Date.now();
      var state = c.disabled ? 'switched off' : expired ? 'expired' : left <= 0 ? 'used up' : n(left) + ' left';
      return item('<b class="code">' + esc(c.code) + '</b><span class="muted">' + n(c.uses) + ' of ' + n(c.max_uses) + ' used · ' + state +
        (c.note ? ' · ' + esc(c.note) : '') + (c.expires_at ? ' · until ' + new Date(c.expires_at).toLocaleDateString('en-IN') : '') + '</span>',
        '<button class="btn" data-acc="copy" data-v="' + esc(c.code) + '">Copy</button>' +
        '<button class="btn" data-acc="copylink" data-v="' + esc(c.code) + '" title="spotogo.in/get with this code: download page + install steps">Copy invite link</button>' +
        '<button class="btn' + (c.disabled ? '' : ' danger') + '" data-acc="' + (c.disabled ? 'on' : 'off') + '" data-v="' + esc(c.code) + '">' + (c.disabled ? 'Switch on' : 'Switch off') + '</button>' +
        '<button class="btn danger" data-acc="delete" data-v="' + esc(c.code) + '" title="Remove this code">Delete</button>');
    }).join('') || '<p class="muted">No codes yet.</p>';
    if (a.codes.length > 6) h += '<button class="btn more" data-acc="all">' + (showAllCodes ? 'Show fewer' : 'Show all ' + n(a.codes.length) + ' codes') + '</button>';
    h += '</div></div>';
    box.innerHTML = h;
    balance();
    box._data = a;
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-acc]');
    if (!b) return;
    var act = b.getAttribute('data-acc'), v = b.getAttribute('data-v');
    if (act === 'all') { showAllCodes = !showAllCodes; return renderAccess($('signups')._data); }
    var done = function (p) { b.disabled = true; p.then(loadAccess).catch(function (err) { alert(err.message); b.disabled = false; }); };
    if (act === 'mode') {
      var msg = v === 'invite' ? 'Switch to invite only? New people without a code go on the waitlist.' : 'Open sign-ups with the daily limit? The waitlist is let in each morning while there’s room.';
      return ask(msg, 'Switch').then(function (ok) { if (ok !== false) done(api('/admin/api/access', { mode: v })); });
    }
    if (act === 'limit') return done(api('/admin/api/access', { limit: Number($('accLimit').value) }));
    if (act === 'email') return done(api('/admin/api/access', { emailLimit: Number($('accEmail').value) }));
    if (act === 'admit') {
      var k = Number($('accLet').value), c = $('accCity') ? $('accCity').value : '';
      return ask('Let the ' + k + ' oldest people on the waitlist' + (c ? ' in ' + c : '') + ' in? Each gets an email.', 'Let them in').then(function (ok) { if (ok !== false) done(api('/admin/api/waitlist/admit', { n: k, city: c || undefined })); });
    }
    if (act === 'create') {
      return done(api('/admin/api/invites', {
        code: $('accCode').value.trim() || undefined, uses: Number($('accUses').value), count: Number($('accCount').value),
        days: $('accDays').value ? Number($('accDays').value) : undefined, note: $('accNote').value.trim() || undefined,
      }));
    }
    if (act === 'off' || act === 'on') return done(api('/admin/api/invites/' + encodeURIComponent(v), { disabled: act === 'off' }));
    if (act === 'delete') {
      return ask('Delete the code ' + v + '? It stops working and leaves the list. People it already let in stay in.', 'Delete', true).then(function (ok) {
        if (ok !== false) done(api('/admin/api/invites/' + encodeURIComponent(v), null, 'DELETE'));
      });
    }
    if (act === 'copy' || act === 'copylink') {
      // The invite link opens spotogo.in/get: the download button, install steps and this code.
      var text = act === 'copy' ? v : 'Try SpotoGo with my invite code ' + v + ': https://spotogo.in/get?code=' + encodeURIComponent(v);
      var label = b.textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject(new Error('Copy isn’t available here.'))).then(function () {
        b.textContent = 'Copied'; setTimeout(function () { b.textContent = label; }, 1500);
      }).catch(function (err) { alert(err.message); });
    }
  });

  function load() {
    $('app').innerHTML = $('app').innerHTML || '<p class="muted">Loading…</p>';
    api('/admin/api/overview').then(render).catch(function (e) {
      if (e.status === 401 || e.status === 403) return start();
      $('app').innerHTML = '<div class="alert">Couldn’t load: ' + esc(e.message) + '</div>';
    });
  }

  var notesFor = {};
  var timer = null;
  function searchSoon() {
    clearTimeout(timer);
    var q = this.value.trim();
    timer = setTimeout(function () {
      if (q.length < 2) { $('people').innerHTML = ''; return; }
      api('/admin/api/users?q=' + encodeURIComponent(q)).then(function (r) {
        $('people').innerHTML = r.users.map(function (u) {
          var status = u.verified ? '<span class="ok">Verified</span>' : u.requested ? '<span class="warn">Asked to be verified ' + ago(u.requested) + '</span>' : '<span class="muted">Not verified</span>';
          if (u.blocked_at) status += '<span class="err"><b>Blocked ' + ago(u.blocked_at) + '</b>' + (u.blocked_reason ? ' · ' + esc(u.blocked_reason) : '') + '</span>';
          var who = u.username ? '@' + esc(u.username) : esc(u.email);
          var blockBtn = '<button class="btn ' + (u.blocked_at ? '' : 'danger') + '" data-act="' + (u.blocked_at ? 'unblock' : 'block') + '" data-id="' + esc(u.id) + '" data-name="' + who + '">' + (u.blocked_at ? 'Unblock' : 'Block') + '</button>';
          var social = (u.social || []).map(function (s) {
            return '<div class="item sub"><div class="main"><span>' + (s.platform === 'instagram' ? 'Instagram' : 'YouTube') + ' @' + esc(s.handle) +
              (s.followers != null ? ' · ' + n(s.followers) + (s.platform === 'youtube' ? ' subscribers' : ' followers') : '') + '</span><span class="muted">' +
              (s.status === 'pending' ? 'waiting' : u.verified ? 'showing on the profile' : 'hidden (not verified)') + ' · ' + ago(s.at) + '</span></div>' +
              '<button class="btn danger" data-act="social-remove" data-id="' + esc(s.id) + '" data-name="' + esc(s.handle) + '">Remove</button></div>';
          }).join('');
          if (!social && u.verified) social = '<p class="muted sub">No Instagram or YouTube on the profile.</p>';
          return '<div class="person"><div class="item"><div class="main"><b>@' + esc(u.username || '—') + (u.kind === 'restaurant' ? ' · restaurant' : '') + '</b>' + '<span class="muted">' + esc(u.email) + ' · ' + n(u.spots) + ' spots · ' + (u.last_active ? 'active ' + esc(u.last_active) : 'not active yet') + '</span>' + status + '</div>' +
            '<button class="btn ' + (u.verified ? 'danger' : 'primary') + '" data-act="' + (u.verified ? 'unverify' : 'verify') + '" data-id="' + esc(u.id) + '" data-name="' + esc(u.username) + '">' + (u.verified ? 'Unverify' : 'Verify') + '</button>' + blockBtn + '</div>' + social + '</div>';
        }).join('') || '<p class="muted">Nobody matches.</p>';
      }).catch(function (e) { $('people').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
    }, 350);
  }

  var ACTIONS = {
    'req-yes': ['Verify @%? They get the pin badge and a Private list, and can show Instagram or YouTube.', 'Verify', false, function (id) { return api('/admin/api/requests/' + id, { approve: true }); }],
    'req-no': ['Reject @%’s request? They stay unverified and can ask again tomorrow.', 'Reject', true, function (id, why) { return api('/admin/api/requests/' + id, { approve: false, reason: why }); }, true],
    'cr-dismiss': ['Dismiss this report about @%? Nothing changes.', 'Dismiss', false, function (id) { return api('/admin/api/content-reports/' + encodeURIComponent(id), { action: 'dismiss' }); }],
    'cr-hide': ['Hide this item by @% from public views? The owner still has it.', 'Hide', false, function (id) { return api('/admin/api/content-reports/' + encodeURIComponent(id), { action: 'hide' }); }],
    'cr-suspend': ['Suspend @%? They’re logged out, can’t log in, and disappear from public views.', 'Suspend', true, function (id) { return api('/admin/api/content-reports/' + encodeURIComponent(id), { action: 'suspend' }); }],
    'place-closed': ['Mark % as closed for good? Everyone who saved it gets a phone alert and sees a grey pin.', 'Closed for good', true, function (id) { return api('/admin/api/place-reports', { ids: id.split(','), action: 'closed' }); }],
    'place-temp': ['Mark % as closed for now? Everyone who saved it gets a phone alert.', 'Closed for now', false, function (id) { return api('/admin/api/place-reports', { ids: id.split(','), action: 'temp' }); }],
    'place-open': ['Mark % as open? Any closure shown for it is cleared.', 'Open', false, function (id) { return api('/admin/api/place-reports', { ids: id.split(','), action: 'open' }); }],
    'place-delivery': ['Mark % as delivery only? Everyone who saved it sees “Delivery only: nowhere to sit”.', 'Delivery only', false, function (id) { return api('/admin/api/place-reports', { ids: id.split(','), action: 'delivery' }); }],
    'place-dinein': ['% has seating? No delivery-only warning shows for it, even from hints.', 'Has seating', false, function (id) { return api('/admin/api/place-reports', { ids: id.split(','), action: 'dinein' }); }],
    'place-dismiss': ['Dismiss the reports for %? Nothing changes on the map.', 'Dismiss', false, function (id) { return api('/admin/api/place-reports', { ids: id.split(','), action: 'dismiss' }); }],
    'name-yes': ['Approve this for %? It changes what diners see.', 'Approve', false, function (id) { return api('/admin/api/names/' + encodeURIComponent(id), { approve: true }); }],
    'name-no': ['Reject this request for %? Tell them why.', 'Reject', true, function (id, why) { return api('/admin/api/names/' + encodeURIComponent(id), { approve: false, reason: why }); }, true],
    'place-rename': ['', '', false, null],
    'place-hours': ['', '', false, null],
    'claim-yes': ['Approve %? They get an official page they manage, with the exact pin.', 'Approve', false, function (id) { return api('/admin/api/claims/' + id, { approve: true }); }],
    'claim-no': ['Reject the claim for %? It stays unclaimed.', 'Reject', true, function (id) { return api('/admin/api/claims/' + id, { approve: false }); }],
    'social-remove': ['Remove @% from that profile?', 'Remove', true, function (id, why) { return api('/admin/api/social/' + id + '/remove', { reason: why }); }, true],
    'verify': ['Verify @%? They get the pin badge and a Private list.', 'Verify', false, function (id) { return api('/admin/api/users/' + id + '/verify', { verified: true }); }],
    'unverify': ['Unverify @%? They lose the badge, and their Instagram/YouTube stops showing. Private spots stay private.', 'Unverify', true, function (id, why) { return api('/admin/api/users/' + id + '/verify', { verified: false, reason: why }); }, true],
    'place-merge': ['Merge “%”? Its spots, timings and name move over; this can’t be undone here.', 'Merge', false, function (id) { var x = id.split('|'); return api('/admin/api/places/merge', { from: x[0], into: x[1] }); }],
    'place-notsame': ['“%” are different restaurants? They stop showing as a pair.', 'Different', false, function (id) { var x = id.split('|'); return api('/admin/api/places/not-same', { a: x[0], b: x[1] }); }],
    'block': ['Block %? They’re logged out on every phone, can’t log in again, and their profile, spots and lists stop showing to anyone.', 'Block', true, function (id, why) { return api('/admin/api/users/' + id + '/block', { blocked: true, reason: why }); }, true, 'Why? This goes to them by email (for example: posting spam spots).'],
    'unblock': ['Unblock %? They can log in again, and their profile, spots and lists show as before. We email them.', 'Unblock', false, function (id) { return api('/admin/api/users/' + id + '/block', { blocked: false }); }],
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    var a = ACTIONS[act];
    if (!a) return;
    if (act === 'place-rename' || act === 'place-hours') {
      // Prefilled with what diners wrote; the founder can correct it.
      var ids = b.getAttribute('data-id'), notes = notesFor[ids] || [];
      var want = act === 'place-rename' ? 'renamed' : 'hours';
      var first = notes.filter(function (x) { return x.kind === want; })[0] || notes[0];
      var guess = first ? first.text : '';
      var v = prompt(act === 'place-rename' ? 'New name for ' + b.getAttribute('data-name') + ':' : 'Hours for ' + b.getAttribute('data-name') + ' (like 12 pm – 11 pm):', guess);
      if (!v || !v.trim()) return;
      b.disabled = true;
      api('/admin/api/place-reports', { ids: ids.split(','), action: act === 'place-rename' ? 'rename' : 'hours', value: v.trim() })
        .then(load).catch(function (err) { alert(err.message); b.disabled = false; });
      return;
    }
    ask(a[0].replace('%', b.getAttribute('data-name') || ''), a[1], a[2], !!a[4], a[5]).then(function (why) {
      if (why === false) return;
      b.disabled = true;
      a[3](b.getAttribute('data-id'), why).then(load).catch(function (err) { alert(err.message); b.disabled = false; });
    });
  });

  start();
})();
</script>
